[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mema-twin"
version = "0.5.0"
description = "Personal work twin: compiles versioned persona prompts from its own preference store and injects them into plan workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
authors = [{ name = "张志维 (billy12151)" }]
dependencies = [
  "mcp>=1.28.0,<2",  # 家族（mema/plan-mode）均在 1.x；2.x 将 FastMCP 改名 MCPServer，迁移另起
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
mema-twin = "mema_twin.server:main"
mema-twin-console = "mema_twin.console_cli:main"
mema-twin-import = "mema_twin.import_mema:main"

[tool.setuptools.packages.find]
include = ["mema_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
