[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mema-twin"
version = "0.2.0"
description = "Personal work twin: compiles versioned persona prompts from mema preference memories and injects them into plan workflows."
readme = "README.md"
requires-python = ">=3.11"
# 许可证待阶段 2 收费形态拍板时定（open-core 需拆分），暂不声明
authors = [{ name = "张志维 (billy12151)" }]
dependencies = [
  "mcp>=1.28.0,<2",  # 家族（mema/plan-mode）均在 1.x；2.x 将 FastMCP 改名 MCPServer，迁移另起
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
# embed 近邻归一档：mema-core 提供 ManagedEmbedder（0.15.4 基线），本地
# embedder 还需 llama-cpp-python（GGUF 推理）；缺省时 embed 档 fail-open 跳过
core = ["memory-arbiter-mcp>=0.15.4", "llama-cpp-python>=0.3.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
mema-twin = "mema_twin.server:main"

[tool.setuptools.packages.find]
include = ["mema_twin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
